<br>
<div class="field">
    <br>
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
      <div formGroupName="nombreCompleto">
        <div class="p-field campo nombre-gerente-container">
          <label for="nombre"><strong>Nombre del gerente</strong></label>
          <span class="p-input-icon-left">
            <span class="icon-t">T</span> <!-- Letra T como icono -->
            <input id="nombre" type="text" pInputText formControlName="nombre" placeholder="" class="w-full" />
          </span>
          <small *ngIf="registroForm.get('nombreCompleto.nombre')?.touched && registroForm.get('nombreCompleto.nombre')?.invalid" class="p-error">
            El nombre es obligatorio
          </small>
        </div>
      </div>

      <br>
      <div class="p-field campo email-container">
        <label for="email"><strong>Correo Electrónico</strong></label>
        <span class="p-input-icon-left">
          <i class="pi pi-envelope"></i>
          <input id="email" type="email" pInputText formControlName="email" placeholder="" class="w-full" />
        </span>
        <small *ngIf="registroForm.controls['email'].touched && registroForm.controls['email'].invalid" class="p-error">
          Correo electrónico no válido
        </small>
      </div>

      <br>
    </form>
</div>
