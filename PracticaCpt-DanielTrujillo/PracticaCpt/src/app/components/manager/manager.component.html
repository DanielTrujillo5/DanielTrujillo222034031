<br>
<div class="field">
    <br>
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
        <div class="p-field campo">
          <label for="nombre"><strong>Nombre del gerente</strong></label>
          <input id="nombre" type="text" pInputText formControlName="nombre" placeholder="Nombre" />
          <small *ngIf="registroForm.get('nombreCompleto.nombre')?.touched && registroForm.get('nombreCompleto.nombre')?.invalid" class="p-error">
            El nombre es obligatorio
          </small>
        </div>
      <br>
      <div class="p-field campo">
        <label for="email"><strong>Correo Electrónico</strong></label>
        <input id="email" type="email" pInputText formControlName="email" placeholder="Correo Electrónico" />
        <small *ngIf="registroForm.controls['email'].touched && registroForm.controls['email'].invalid" class="p-error">
          Correo electrónico no válido
        </small>
      </div>
      <br>
    </form>
  </div>
